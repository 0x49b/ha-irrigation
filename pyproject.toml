[project]
name = "ha-irrigation"
version = "0.10.4"
description = "Home Assistant custom integration for scheduled irrigation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.8"
# The integration itself has no runtime requirements (see manifest.json).
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
